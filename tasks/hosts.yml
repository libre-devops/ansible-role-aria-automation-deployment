---
# Turns every machine of every deployment into an inventory host: in memory with add_host, for
# later plays in this run, and optionally in a YAML inventory file, for a later run.
#
# aria_automation_deployment_host_name and aria_automation_deployment_host_vars are templated
# here, once per machine, with the machine as `resource`.

- name: Check the host name and host variables templates
  ansible.builtin.assert:
    that:
      - aria_automation_deployment_host_name is string
      - aria_automation_deployment_host_name | length > 0
      - aria_automation_deployment_host_vars is mapping
    fail_msg: >-
      aria_automation_deployment_host_name must give a non-empty string, and
      aria_automation_deployment_host_vars must be a dictionary, for machine {{ resource.name }}.
    quiet: true
  loop: "{{ aria_automation_deployment_results | map(attribute='machines') | flatten }}"
  loop_control:
    loop_var: resource
    label: "{{ resource.name }}"
  no_log: "{{ aria_automation_deployment_no_log | bool }}"

- name: Start with no hosts
  ansible.builtin.set_fact:
    __aria_automation_deployment_hosts: []

- name: Work out each machine's host name and variables
  ansible.builtin.set_fact:
    __aria_automation_deployment_hosts: >-
      {{ __aria_automation_deployment_hosts + [{
           'name': aria_automation_deployment_host_name,
           'vars': aria_automation_deployment_host_vars
         }] }}
  loop: "{{ aria_automation_deployment_results | map(attribute='machines') | flatten }}"
  loop_control:
    loop_var: resource
    label: "{{ resource.name }}"
  no_log: "{{ aria_automation_deployment_no_log | bool }}"

# The in-memory inventory belongs to this run only, so adding to it is not a change.
- name: Add the machines to the in-memory inventory
  aria_automation_deployment_add_host:
    name: "{{ host.name }}"
    groups: "{{ aria_automation_deployment_groups }}"
    variables: "{{ host.vars }}"
  loop: "{{ __aria_automation_deployment_hosts }}"
  loop_control:
    loop_var: host
    label: "{{ host.name }}"
  changed_when: false
  no_log: "{{ aria_automation_deployment_no_log | bool }}"
  when: aria_automation_deployment_add_hosts | bool

- name: Write the inventory file
  ansible.builtin.template:
    src: inventory.yml.j2
    dest: "{{ aria_automation_deployment_inventory_file }}"
    mode: "0644"
  when: aria_automation_deployment_inventory_file | length > 0

- name: Wait until each machine accepts connections
  ansible.builtin.wait_for_connection:
    timeout: "{{ aria_automation_deployment_connection_timeout }}"
  delegate_to: "{{ host.name }}"
  loop: "{{ __aria_automation_deployment_hosts }}"
  loop_control:
    loop_var: host
    label: "{{ host.name }}"
  when:
    - aria_automation_deployment_wait_for_connection | bool
    - aria_automation_deployment_add_hosts | bool
