---
- name: Verify
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Read the mock's counters
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/mock/stats"
      register: __mock_stats

    - name: Check what the role asked for
      ansible.builtin.assert:
        that:
          # Two deployments in converge, none in idempotence, one failing in side_effect.
          - __mock_stats.json.catalog_requests == 3
          # The three that existed were deleted; molecule-never-existed was not asked for.
          - __mock_stats.json.deletes == 3
          - __mock_stats.json.deployments == []
          # Only side_effect's second play signed in with a user name and password.
          - __mock_stats.json.csp_logins == 1
        quiet: true

    - name: Look for the inventory file
      ansible.builtin.stat:
        path: "{{ mock_inventory_file }}"
      register: __inventory_stat

    - name: Check the inventory file was removed with the deployments
      ansible.builtin.assert:
        that:
          - not __inventory_stat.stat.exists
        quiet: true
